# CERN/lxplus-only fragment: bind-mounts /eos, /afs, /tmp into the singularity sandbox
# for EOS/EosSubmit access. Included via KingMaker_law.cfg's [core] extend, which
# setup.sh points at this file only when running on a *.cern.ch host.

[singularity_sandbox]
allow_binds = True

[singularity_sandbox_volumes]
/eos = /eos
/afs = /afs
/tmp = /tmp
