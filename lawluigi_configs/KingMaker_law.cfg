[modules]
CROWNBase
CROWNMain
CROWNFriend
ProduceNtuples

[logging]
# law: DEBUG
# luigi-interface: DEBUG
# gfal2: DEBUG
# xrootd.stat: DEBUG

[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 3

[target]
default_wlcg_fs = wlcg_fs

[wlcg_fs]
# Remote storage location, also change this in the luigi config file
# NRG storage
base: root://cmsdcache-kit-disk.gridka.de//store/user/${USER}/CROWN/ntuples/
# EOS storage
# base: root://eosuser.cern.ch//eos/user/${USER_FIRST_LETTER}/${USER}/CROWN/ntuples/
use_cache: True
cache_root: /tmp/${USER}/
cache_max_size: 20000

[singularity_sandbox]
forward_law = False
allow_binds = True
# No [singularity_sandbox_volumes] here: /eos, /afs only exist on CERN hosts, and law
# tries to os.makedirs() every host path listed here regardless of site, which crashes
# off-CERN. setup.sh already binds /eos, /afs, /tmp natively and conditionally via
# SINGULARITY_BIND/APPTAINER_BIND (set only on CERN hosts), so no law-level config is
# needed for this at all.

[singularity_sandbox_env]
# The sandbox runs with a clean environment by default; LAW_ACCOUNTING_GROUP (used by
# KingMaker_luigi.cfg's htcondor_accounting_group) must be explicitly forwarded from the
# host or ${LAW_ACCOUNTING_GROUP} fails to resolve inside the container.
LAW_ACCOUNTING_GROUP

[core]
# CERN/lxplus runs a local scheduler by default (see also 'local_scheduler' in the
# luigi config); KIT/ETP uses a central scheduler, so this can be left unset there.
local-scheduler = True
