[modules]
CROWNBase
CROWNMain
CROWNFriend
ProduceNtuples

[logging]
# law: DEBUG
# luigi-interface: DEBUG
# gfal2: DEBUG
# xrootd.stat: DEBUG

[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 3

[target]
default_wlcg_fs = wlcg_fs

[wlcg_fs]
# Remote storage location, also change this in the luigi config file
# NRG storage
base: root://cmsdcache-kit-disk.gridka.de//store/user/${USER}/CROWN/ntuples/
# EOS storage
# base: root://eosuser.cern.ch//eos/user/${USER_FIRST_LETTER}/${USER}/CROWN/ntuples/
use_cache: True
cache_root: /tmp/${USER}/
cache_max_size: 20000

[singularity_sandbox]
forward_law = False
# Needed on CERN/lxplus to bind /eos, /afs into the container (see below).
# Comment out at sites (e.g. KIT/ETP) where these host paths don't exist.
allow_binds = True

# CERN/lxplus only: bind mounts for EOS/AFS access inside the container. These host
# paths generally don't exist at other sites (e.g. KIT/ETP) - comment out this whole
# section, and 'allow_binds' above, when running there.
[singularity_sandbox_volumes]
/eos = /eos
/afs = /afs
/tmp = /tmp

[core]
# CERN/lxplus runs a local scheduler by default (see also 'local_scheduler' in the
# luigi config); KIT/ETP uses a central scheduler, so this can be left unset there.
local-scheduler = True
