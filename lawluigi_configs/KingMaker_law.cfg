[modules]
CROWNBase
CROWNMain
CROWNFriend
ProduceNtuples

[logging]
# law: DEBUG
# luigi-interface: DEBUG
# gfal2: DEBUG
# xrootd.stat: DEBUG

[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 3

[target]
default_wlcg_fs = wlcg_fs

[wlcg_fs]
# Remote storage location, also change this in the luigi config file
# NRG storage
base: root://cmsdcache-kit-disk.gridka.de//store/user/${USER}/CROWN/ntuples/
# EOS storage
# base: root://eosuser.cern.ch//eos/user/${USER_FIRST_LETTER}/${USER}/CROWN/ntuples/
use_cache: True
cache_root: /tmp/${USER}/
cache_max_size: 20000

[singularity_sandbox]
forward_law = False
# CERN/lxplus needs binds for EOS/AFS access; those host paths don't exist at other
# sites (e.g. KIT/ETP), so this stays off by default and is enabled by extending with
# KingMaker_law_eos.cfg (see setup.sh, which sets LAW_EXTEND_CONFIG on CERN hosts).
allow_binds = False

[core]
# CERN/lxplus runs a local scheduler by default (see also 'local_scheduler' in the
# luigi config); KIT/ETP uses a central scheduler, so this can be left unset there.
local-scheduler = True
extend: ${LAW_EXTEND_CONFIG}
