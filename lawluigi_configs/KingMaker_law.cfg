[modules]
CROWNBase
CROWNMain
CROWNFriend
ProduceNtuples

[logging]
# law: DEBUG
# luigi-interface: DEBUG
# gfal2: DEBUG
# xrootd.stat: DEBUG

[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 3

[target]
default_wlcg_fs = wlcg_fs

[wlcg_fs]
# Remote storage location, also change this in the luigi config file
# NRG storage
base: root://cmsdcache-kit-disk.gridka.de//store/user/${USER}/CROWN/ntuples/
# EOS storage
# base: root://eosuser.cern.ch//eos/user/${USER_FIRST_LETTER}/${USER}/CROWN/ntuples/
use_cache: True
cache_root: /tmp/${USER}/
cache_max_size: 20000

[singularity_sandbox]
forward_law = False

[singularity_sandbox_env]
LAW_ACCOUNTING_GROUP
PYTHONNOUSERSITE = 1
# portal2 resolves github.com via the search domain to github.com.delight.kit.edu inside the sandbox, so the
# spdlog clone of the CROWN library build fails (2026-10-17); clone it from a local mirror instead
GIT_CONFIG_COUNT = 1
GIT_CONFIG_KEY_0 = url.file:///work/sdaigler/bbtautau/KingMaker/build/_mirrors/spdlog.git.insteadOf
GIT_CONFIG_VALUE_0 = https://github.com/gabime/spdlog.git
